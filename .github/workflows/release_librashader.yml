name: Fork release - Windows x64 (static librashader)

# Isolated release workflow: rebuild the current fork master as a prerelease.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release_librashader.yml'

permissions:
  contents: write

concurrency:
  group: fork-release-v7.0-librashader-20261013
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RELEASE_TAG: v7.0-librashader-20261013
      LIBRASHADER_COMMIT: f810cdf6e856e5a5215b1e84a21c978bc3367f23

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure MSYS2 mirrors and slow downloads
        shell: pwsh
        run: |
          $mirrorDir = 'C:\msys64\etc\pacman.d'
          if (-not (Test-Path $mirrorDir)) { throw 'Preinstalled MSYS2 was not found' }
          Set-Content -Path (Join-Path $mirrorDir 'mirrorlist.mingw') -Encoding ascii -Value 'Server = https://repo.msys2.org/mingw/$repo'
          Set-Content -Path (Join-Path $mirrorDir 'mirrorlist.msys') -Encoding ascii -Value 'Server = https://repo.msys2.org/msys/$arch'
          $configPath = 'C:\msys64\etc\pacman.conf'
          $config = Get-Content -Path $configPath -Raw
          if ($config -notmatch '(?m)^DisableDownloadTimeout[ \t]*$') {
            $config = $config -replace '(?m)^\[options\][ \t]*$', ('[options]' + [Environment]::NewLine + 'DisableDownloadTimeout')
            Set-Content -Path $configPath -Encoding ascii -Value $config
          }

      - name: Prepare MSYS2 / UCRT64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          release: false
          update: true
          msystem: UCRT64
          install: git
          pacboy: >-
            ninja:p
            cmake:p
            gcc:p
            pkgconf:p
            freetype:p
            sdl3:p
            zlib:p
            libpng:p
            openal:p
            rtmidi:p
            libslirp:p
            fluidsynth:p
            libserialport:p
            qt5-static:p
            vulkan-headers:p
            libsndfile:p
            llvm-openmp:p
            zstd:p
            rust:p
            rust-src:p
            cargo-c:p
            make:p

      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile librashader static library (same revision as Jenkins)
        run: |
          set -e
          mkdir librashader-src
          git -C librashader-src init
          git -C librashader-src remote add origin https://github.com/SnowflakePowered/librashader.git
          git -C librashader-src fetch --depth=1 origin "$LIBRASHADER_COMMIT"
          git -C librashader-src checkout --detach FETCH_HEAD
          export RUSTFLAGS="-C target-feature=+crt-static"
          cd librashader-src
          cargo build -p librashader-capi --release --no-default-features --features runtime-vulkan
          test -s target/release/liblibrashader_capi.a

      - name: Configure release build (static librashader)
        run: |
          set -e
          cmake -S . -B release-build --preset regular \
            -D QT=ON \
            -D STATIC_BUILD=ON \
            -D NEW_DYNAREC=OFF \
            -D LIBRASHADER=ON \
            -D LIBRASHADER_STATIC=ON \
            -D LIBRASHADER_STATIC_FIND_LIB=ON \
            -D "LIBRASHADER_STATIC_LIB=$(pwd)/librashader-src/target/release/liblibrashader_capi.a" \
            -D "CMAKE_INSTALL_PREFIX=$(pwd)/release-stage"
          grep -q '^LIBRASHADER_STATIC:BOOL=ON$' release-build/CMakeCache.txt
          grep -q '^LIBRASHADER_STATIC_FIND_LIB:BOOL=ON$' release-build/CMakeCache.txt

      - name: Compile and install release
        run: |
          set -e
          cmake --build release-build --parallel 4
          cmake --install release-build
          test -s release-stage/86Box.exe

      - name: Package and update existing GitHub prerelease (not an Actions artifact)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $stableName = '86Box-7.0-Windows-x64-librashader-static.zip'
          $candidateName = "86Box-7.0-Windows-x64-librashader-static-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          $archive = Join-Path $env:RUNNER_TEMP $candidateName

          # Do not change or remove the published archive if compilation fails.
          Compress-Archive -Path 'release-stage\*' -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -lt 1000000) {
            throw 'Release ZIP is missing or unexpectedly small.'
          }

          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.id) { throw 'Existing prerelease not found.' }
          $tagSha = gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing tag.' }
          if ($tagSha -ne '204e037e1929017eca2d68ae5245e412eb1c2a22') {
            throw "Existing tag has changed ($tagSha); refusing to overwrite it."
          }

          # Upload with a unique temporary name first, leaving the original ZIP
          # untouched until the new one is safely stored on the release.
          gh release upload $tag $archive --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the candidate release asset failed.' }

          $assets = @(gh api "repos/$repo/releases/$($release.id)/assets" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect uploaded assets.' }
          $candidate = $assets | Where-Object { $_.name -eq $candidateName } | Select-Object -First 1
          $previous = $assets | Where-Object { $_.name -eq $stableName } | Select-Object -First 1
          if (-not $candidate -or $candidate.size -lt 1000000 -or $candidate.state -ne 'uploaded') {
            throw 'New release asset was not uploaded correctly; existing asset preserved.'
          }
          if (-not $previous) { throw 'Existing release asset was not found; refusing to replace it.' }

          gh api -X DELETE "repos/$repo/releases/assets/$($previous.id)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the old release asset.' }
          gh api -X PATCH "repos/$repo/releases/assets/$($candidate.id)" -f "name=$stableName" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not rename the new release asset.' }

          # The existing release tag cannot be force-moved with GITHUB_TOKEN:
          # GitHub responds with HTTP 403 even though asset uploads succeed.
          # Keep the established release URL and update metadata with the build SHA.
          $notes = @'
          86Box 7.0 development snapshot from AITUS95/86Box, Windows x64 (UCRT64).

          Updated build of the fork for Windows x64.
          librashader is linked statically into 86Box.exe (no librashader.dll needed),
          using the same librashader source revision and static-build approach as Jenkins.

          This standalone Release ZIP is separate from GitHub Actions build artifacts.
          Existing artifacts and existing CI workflows are not modified.
          This is an unofficial fork build, not an official upstream 86Box release.
          '@

          # The tag continues to reference the original snapshot; the release
          # asset is the current build. Record its exact source commit explicitly.
          $notes += "`n`nWindows x64 ZIP build commit: $env:GITHUB_SHA"
          $notes += "`nThe Git tag is retained for the stable release URL; download the attached ZIP for the updated binary."

          gh release edit $tag --repo $repo --target $env:GITHUB_SHA --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Failed to update release metadata.' }
          $confirmedRelease = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $confirmedRelease.target_commitish -ne $env:GITHUB_SHA) {
            throw 'Release metadata does not match this build commit.'
          }
          $confirmedZip = $confirmedRelease.assets | Where-Object { $_.name -eq $stableName } | Select-Object -First 1
          if (-not $confirmedZip -or $confirmedZip.size -lt 1000000) {
            throw 'The final release archive is not available.'
          }
          Write-Host "Updated prerelease $tag: build $env:GITHUB_SHA, asset $stableName"
